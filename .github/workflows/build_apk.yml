name: Build TerraMag APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }

      - name: Assemble sources and model
        run: |
          python3 - <<'PY'
          import os, re, glob
          c = glob.glob('**/project_bundle*', recursive=True)
          print('found bundle:', c)
          t = open(c[0], encoding='utf-8').read()
          parts = re.split(r'^=== FILE: (.+?) ===\n', t, flags=re.M)
          for i in range(1, len(parts), 2):
              path = 'app/' + parts[i]
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, 'w', encoding='utf-8').write(parts[i + 1])
          PY
          mkdir -p app/assets/models
          find . -name 'model_part_*' | sort
          cat $(find . -name 'model_part_*' | sort) > app/assets/models/best2.onnx
          ls -la app/assets/models

      - name: Create Android host project (keep our lib and pubspec)
        working-directory: app
        run: |
          cp -r lib /tmp/lib_bak && cp pubspec.yaml /tmp/pubspec_bak.yaml
          flutter create --platforms=android --project-name terramag --org com.terramag .
          rm -rf lib test && cp -r /tmp/lib_bak lib && cp /tmp/pubspec_bak.yaml pubspec.yaml

      - name: Bluetooth permissions and minSdk
        working-directory: app
        run: |
          python3 - <<'PY'
          p="android/app/src/main/AndroidManifest.xml"
          s=open(p).read()
          perms='''
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30"/>
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true"/>
          '''
          i=s.index('>', s.index('<manifest'))+1
          open(p,"w").write(s[:i]+perms+s[i:])
          PY
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle* || true

      # Some plugins (e.g. file_picker) are compiled against an older Android API than
      # their own dependencies require. Force every module to compile against API 36.
      - name: Force compileSdk 36 for all plugins
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          allprojects {
              afterEvaluate { p ->
                  def ext = p.extensions.findByName('android')
                  if (ext != null) { ext.compileSdkVersion 36 }
              }
          }
          GRADLE

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: terramag-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
